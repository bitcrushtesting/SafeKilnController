# SPDX-License-Identifier: GPL-3.0-or-later
#
# Per SWR-TST-24, everything here blocks merge.  Architecture 14.6 describes six
# parallel jobs; the web asset budget arrives with the component it checks
# (tasklist C8).  Static analysis (SWR-NFR-25) is the `tidy` job below.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded push has nothing useful left to say.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned for the same reason IDF_VERSION is: a check set that changes under a
  # safety-relevant build is a variable nobody asked for.  A new LLVM adds
  # checks, and with WarningsAsErrors: '*' a new check is a red build on a
  # commit that changed nothing.
  LLVM_VERSION: '20'
  # Pinned for the same reason: StrictDoc validates the requirements document
  # (duplicate UIDs, references to requirements that do not exist), and a
  # validator that changes under a safety-relevant document is a variable
  # nobody asked for.  A new release can add a rule and turn a green build red
  # on a commit that changed nothing.
  STRICTDOC_VERSION: '0.30.1'

  # Pinned to the version the build is actually verified against, rather than
  # floating: a toolchain that changes under a safety-relevant build is a
  # variable nobody asked for.  Note that 6.0 split the monolithic `driver`
  # component per peripheral, which is why main/ asks for esp_driver_uart.
  IDF_VERSION: v6.0.1

jobs:
  # --- architecture 14.5 enforcement -------------------------------------
  checks:
    name: Layering and licence hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Three architecture decisions, structurally (SWA-14, SWA-03, SWA-02)
        run: |
          # tools/layercheck.sh, which replaced the grep that used to be here
          # and says in its own header why. Three decisions that held by
          # discipline alone are now checked:
          #
          #   SWA-14  the core includes no platform header, read from the
          #           preprocessor's own record rather than from include lines,
          #           so an indirect or ESP_PLATFORM-guarded one is caught too.
          #   SWA-03  no mutable file-scope state in the core, read from the
          #           object code, which also catches a function-local static.
          #   SWA-02  no direct clock read in the core, read from its
          #           undefined symbols.
          #
          # The last two are what make a 168 h firing testable in milliseconds,
          # and both would break silently: the tests keep passing, they just
          # stop testing what they claim to.
          #
          # Its own self-test runs first, because a gate nobody has seen fail
          # is a gate nobody should trust.
          tools/layercheck.sh --self-test
          # The host build is needed for the object-code checks; the target
          # build is not available in this job, and the script says which
          # checks it skipped rather than reporting a pass it did not make.
          cmake -B build-host -S firmware/controller/test/host >/dev/null
          cmake --build build-host -j"$(nproc)" --target kiln_core >/dev/null
          tools/layercheck.sh

      - name: kiln_ports is headers only (architecture 4, rule 2)
        run: |
          if find firmware/controller/components/kiln_ports -name '*.cpp' | grep -q .; then
            echo "::error::kiln_ports must contain no sources"
            exit 1
          fi
          echo "clean"

      - name: Release tool self-tests (SWR-UPD-11, SEC-05)
        run: |
          # The tools that sign things carry their own checks and need neither a
          # board nor ESP-IDF. They are run here because the failure mode is
          # quiet: a manifest whose signature does not verify, or a bootloader
          # that overruns the partition table, is discovered on a device that
          # cannot then be told otherwise.
          python3 tools/update-manifest.py --self-test
          python3 tools/secure-boot.py --self-test
          python3 tools/sbom.py --self-test

      - name: SPDX header on every source file (SWR-NFR-18, UR-CON-04)
        run: |
          missing=0
          while IFS= read -r f; do
            grep -q 'SPDX-License-Identifier' "$f" \
              || { echo "::error file=$f::no SPDX header"; missing=1; }
          done < <(git ls-files \
                     '*.cpp' '*.h' '*.md' '*.sdoc' 'CMakeLists.txt' '*/CMakeLists.txt' \
                     'firmware/controller/**/Kconfig*' 'firmware/controller/*.csv' 'firmware/controller/sdkconfig.*' \
                     'tools/*.sh' 'tools/*.py' '.github/workflows/*.yml' 'strictdoc.toml' \
                   | grep -v '^LICENSE' \
                   | grep -vE '^fixture/(board|firmware)/')
            # fixture/board and fixture/firmware are generated verbatim by
            # pinside, which is MIT licensed. Stamping GPL-3.0-or-later headers
            # on another project's output would be a licensing misstatement, and
            # they would be overwritten by the next `pinside generate` anyway.
            # The inputs this project owns are NOT excluded:
            # fixture/kilncontrol-fixture.json and fixture/README.md.
          exit $missing

  # --- architecture 14.4: unit, integration and fuzz, on the host --------
  host-tests:
    name: Host tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: plain
            cmake_flags: ''
          - name: asan+ubsan
            cmake_flags: '-DENABLE_ASAN=ON'
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build-host -S firmware/controller/test/host ${{ matrix.cmake_flags }}

      - name: Build
        run: cmake --build build-host -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build-host --output-on-failure

  # --- SWR-NFR-25 / SWR-TST-24: static analysis -----------------------------------
  #
  # Fully blocking: WarningsAsErrors is '*' in .clang-tidy and there is no
  # suppressions baseline.  Every check that fires today was either fixed or
  # switched off with a written reason in that file -- so a finding here is
  # genuinely new, not a pre-existing one that drifted into view.
  #
  # NOT MISRA, and the config says so at length: clang-tidy implements no MISRA
  # checks in any release, and the hicpp-* module that approximated High
  # Integrity C++ was removed from LLVM entirely.  What runs here is that same
  # content under its current names (cppcoreguidelines-*, bugprone-*, cert-*).
  tidy:
    name: Static analysis (clang-tidy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-tidy ${{ env.LLVM_VERSION }}
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          sudo add-apt-repository -y \
            "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-${LLVM_VERSION} main"
          sudo apt-get update -qq
          sudo apt-get install -y -qq "clang-tidy-${LLVM_VERSION}"
          sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy \
            "/usr/bin/clang-tidy-${LLVM_VERSION}" 100
          clang-tidy --version

      - name: Generate the compile databases
        run: |
          cmake -B build-host -S firmware/controller/test/host -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake -B build-webhost -S firmware/controller/host/webhost -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake -B build-sup-tidy -S firmware/supervisor/test/host -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      # Covers four databases: the host build, host/webhost (its own CMake
      # project, unanalysed until tasklist F1b), the supervisor's host project,
      # and a synthesised one for the supervisor's two target-only units.
      #
      # The supervisor needs no ARM toolchain here.  src/main.cpp and
      # board/startup.cpp include only <stdint.h> and the project's own headers,
      # so tools/tidy.sh analyses them with clang's bare-metal thumbv6m target
      # and -ffreestanding; STM32CubeCLT is needed to BUILD the image, not to
      # parse it.  That script refuses to report those two clean unless it can
      # prove it built an AST for both, for the same reason tidy-target.sh does.
      #
      # The fifth, the ESP-IDF adapter layer, needs the target toolchain and is
      # the job below.
      - name: Analyse
        run: tools/tidy.sh

  # --- SWR-NFR-25 / SWR-TST-24: static analysis, target side (tasklist F1b) --------
  #
  # kiln_hal_esp32s3 cannot be analysed from the host database -- it needs the
  # ESP-IDF and xtensa headers -- so it is driven from the database idf.py
  # emits, inside the same container that produced it.  clang-tidy is not in
  # that image, so it is installed there.
  #
  # The reason this is a job of its own rather than a step bolted onto
  # `firmware`: it must be able to fail on its own terms.  tools/tidy-target.sh
  # refuses to report clean unless it can prove it built an AST for every one
  # of our translation units, because the obvious failure here is not a red
  # build -- it is a green one that analysed nothing.
  tidy-target:
    name: Static analysis (esp32s3 adapters)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and analyse inside the IDF container
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: esp32s3
          path: firmware/controller
          command: |
            export SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.qemu"
            idf.py build
            # The image is Debian; clang-tidy comes from apt.llvm.org at the
            # same pinned version the host-side job uses, so the two cannot
            # disagree about which checks exist.
            apt-get update -qq
            apt-get install -y -qq wget gnupg lsb-release software-properties-common
            wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
              | tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
            add-apt-repository -y \
              "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-${{ env.LLVM_VERSION }} main"
            apt-get update -qq
            apt-get install -y -qq "clang-tidy-${{ env.LLVM_VERSION }}"
            update-alternatives --install /usr/bin/clang-tidy clang-tidy \
              "/usr/bin/clang-tidy-${{ env.LLVM_VERSION }}" 100
            clang-tidy --version
            # IDF_TOOLS_PATH is /opt/esp in this image; the script needs it to
            # find the xtensa picolibc headers, and fails loudly without them
            # rather than analysing nothing and calling it clean.
            #
            # `cd ../..` rather than `cd "$GITHUB_WORKSPACE"`: that variable is
            # not exported into this container, so `cd ""` quietly succeeded,
            # left the shell in firmware/controller and the next line died with
            # "tools/tidy-target.sh: No such file or directory" (exit 127). The
            # action runs the command from `path:` above, so two levels up is
            # the repository root and does not depend on an environment this
            # container may not carry.
            cd ../..
            tools/tidy-target.sh

  # SWR-TST-19.  The line floor is enforced; measured at 97.5 % on kiln_core when
  # this was written, so 90 % is a floor with room above it rather than a
  # number chosen to match whatever the code happened to do.
  #
  # Still outstanding (tasklist C10): SWR-TST-19 also wants *100 % of safety decision
  # branches*, and branch coverage is around 83 % overall.  Reported here so the
  # gap is visible; gating it needs the remaining branches either covered or
  # individually justified, which is work rather than a flag.
  coverage:
    name: Coverage (SWR-TST-19)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gcovr
        run: pipx install gcovr

      - name: Build instrumented and run
        run: |
          cmake -B build-cov -S firmware/controller/test/host -DENABLE_COVERAGE=ON
          cmake --build build-cov -j"$(nproc)"
          ctest --test-dir build-cov --output-on-failure

      - name: Report and enforce the line floor
        run: |
          # pipefail, or tee would swallow the --fail-under-line verdict.
          set -o pipefail
          mkdir -p coverage
          gcovr --root . \
                --filter 'firmware/controller/components/kiln_core/src/' \
                --exclude-unreachable-branches \
                --fail-under-line 90 \
                --txt coverage/report.txt \
                --html-details coverage/index.html \
                --print-summary \
                build-cov | tee coverage/summary.txt

      - name: Summarise
        if: always()
        run: |
          {
            echo '### kiln_core coverage (SWR-TST-19)'
            echo
            echo '```'
            cat coverage/summary.txt 2>/dev/null || echo 'not produced'
            echo '```'
            echo
            echo '<details><summary>Per file</summary>'
            echo
            echo '```'
            cat coverage/report.txt 2>/dev/null || echo 'not produced'
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: warn

  # --- the supervisor: unit tests and MC/DC ------------------------------
  #
  # The supervisor's trip logic is the one place in the project where a missed
  # *condition* means heat that should have stopped, and its permit decision is
  # a five-term conjunction.  One test with everything true and one with
  # everything false gives 100 % line and branch coverage of that decision and
  # proves almost nothing; MC/DC requires each term to be shown to change the
  # outcome on its own.  gcov cannot measure that, so this job uses Clang's
  # -fcoverage-mcdc rather than the gcovr used for kiln_core's line floor.
  supervisor:
    name: Supervisor tests and MC/DC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Clang ${{ env.LLVM_VERSION }}
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          sudo add-apt-repository -y \
            "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-${LLVM_VERSION} main"
          sudo apt-get update -qq
          sudo apt-get install -y -qq "clang-${LLVM_VERSION}" "llvm-${LLVM_VERSION}"

      - name: Unit tests
        run: |
          cmake -B build-sup -S firmware/supervisor/test/host
          cmake --build build-sup -j"$(nproc)"
          ctest --test-dir build-sup --output-on-failure

      # SWR-TST-20.  A second run of the same four suites under ASan and UBSan,
      # in its own build directory so the instrumented objects never mix with
      # the plain ones.
      #
      # It is a separate step rather than a matrix leg, which the controller's
      # host-tests job uses, because this job also owns the MC/DC measurement
      # and that must run exactly once: a matrix would run it twice and publish
      # two step summaries for the same numbers.
      #
      # Why the supervisor needs this at all, having gone without it: its
      # arithmetic is now entirely fixed point.  A 19-bit field reassembled
      # across three register bytes, a sign-extending shift, a magnitude taken
      # in unsigned arithmetic and saturating millisecond timers each have an
      # undefined-behaviour failure mode that is invisible at -O0 on x86 and
      # would be a wrong temperature on the target.  Checked rather than
      # assumed: reintroducing the signed subtraction that `disagreeing`
      # deliberately avoids makes this step fail and leaves the step above
      # passing.
      #
      # ENABLE_ASAN also turns off UBSan's recovery, so a finding aborts instead
      # of printing and leaving the exit code at zero.  See the CMakeLists.
      - name: Unit tests (asan+ubsan)
        run: |
          cmake -B build-sup-asan -S firmware/supervisor/test/host -DENABLE_ASAN=ON
          cmake --build build-sup-asan -j"$(nproc)"
          ctest --test-dir build-sup-asan --output-on-failure

      - name: MC/DC
        env:
          CLANGXX: /usr/bin/clang++-${{ env.LLVM_VERSION }}
          LLVM_PROFDATA: /usr/bin/llvm-profdata-${{ env.LLVM_VERSION }}
          LLVM_COV: /usr/bin/llvm-cov-${{ env.LLVM_VERSION }}
        run: tools/mcdc.sh

      - name: Summarise
        if: always()
        env:
          CLANGXX: /usr/bin/clang++-${{ env.LLVM_VERSION }}
          LLVM_PROFDATA: /usr/bin/llvm-profdata-${{ env.LLVM_VERSION }}
          LLVM_COV: /usr/bin/llvm-cov-${{ env.LLVM_VERSION }}
        run: |
          {
            echo '### Supervisor coverage'
            echo
            echo 'SWR-TST-29: at least 80 % MC/DC on the trip logic and the link format.'
            echo '```'
            tools/mcdc.sh 2>&1 | tail -12 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # --- the requirements document ----------------------------------------
  #
  # docs/03_software_req.sdoc is the specification, and StrictDoc is what makes it
  # more than prose: it refuses to build a document with two nodes sharing a
  # UID, or an inline reference to a requirement that does not exist.  Both of
  # those were real defects in the markdown this replaced -- SWR-WEB-26 was
  # defined twice, and SWR-SAF-31 had been orphaned by a blank line in the middle of
  # its table -- and neither was findable by reading.
  #
  # So this job is a gate first and a publisher second: `strictdoc export`
  # fails on an invalid document, and the HTML it produces is uploaded only if
  # the document was valid.
  requirements:
    name: Requirements (StrictDoc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install StrictDoc ${{ env.STRICTDOC_VERSION }}
        run: |
          pipx install "strictdoc==${STRICTDOC_VERSION}"
          strictdoc --version

      # Validation and export are the same command: the export fails on a
      # duplicate UID or a dangling [LINK: ...] rather than producing a
      # document that quietly disagrees with itself.
      - name: Validate and export
        run: strictdoc export . --output-dir build-docs --formats=html,json

      - name: Summarise
        if: always()
        run: |
          {
            echo '### Requirements specification'
            echo
            if [ -d build-docs/html ]; then
              echo "StrictDoc validated \`03_software_req.sdoc\`, \`04_software_arch.sdoc\`, \`safety.sdoc\` and \`security.sdoc\`, and exported them."
              echo
              echo '```'
              printf 'user reqs      %s, %s markets, %s regulations\n' \
                "$(grep -c '^\[REQUIREMENT\]' docs/01_user_req.sdoc)" \
                "$(grep -c '^\[MARKET\]' docs/01_user_req.sdoc)" \
                "$(grep -c '^\[REGULATION\]' docs/01_user_req.sdoc)"
              printf 'system reqs    %s\n' \
                "$(grep -c '^\[REQUIREMENT\]' docs/02_system_req.sdoc)"
              printf 'software reqs  %s\n' \
                "$(grep -c '^\[REQUIREMENT\]' docs/03_software_req.sdoc)"
              printf 'constraints    %s\n' \
                "$(grep -c '^\[CONSTRAINT\]' docs/03_software_req.sdoc)"
              printf 'assumptions    %s\n' \
                "$(grep -c '^\[ASSUMPTION\]' docs/03_software_req.sdoc)"
              printf 'open questions %s\n' \
                "$(grep -c '^\[QUESTION\]' docs/03_software_req.sdoc)"
              printf 'cross-refs     %s validated [LINK:] references\n' \
                "$(grep -co '\[LINK: ' docs/03_software_req.sdoc)"
              printf 'decisions      %s, with %s Satisfies relations\n' \
                "$(grep -c '^\[DECISION\]' docs/04_software_arch.sdoc)" \
                "$(grep -c '^- TYPE: Parent' docs/04_software_arch.sdoc)"
              printf 'hazards        %s\n' \
                "$(grep -c '^\[HAZARD\]' docs/safety.sdoc)"
              printf 'safety goals   %s, with %s Mitigates and %s Realised by relations\n' \
                "$(grep -c '^\[SAFETY_GOAL\]' docs/safety.sdoc)" \
                "$(grep -c '^  ROLE: Mitigates' docs/safety.sdoc)" \
                "$(grep -c '^  ROLE: Realised by' docs/safety.sdoc)"
              printf 'residual risks %s\n' \
                "$(grep -c '^\[RESIDUAL_RISK\]' docs/safety.sdoc)"
              printf 'threats        %s, with %s reaching a hazard\n' \
                "$(grep -c '^\[THREAT\]' docs/security.sdoc)" \
                "$(grep -c '^  ROLE: Reaches' docs/security.sdoc)"
              printf 'security goals %s\n' \
                "$(grep -c '^\[SECURITY_GOAL\]' docs/security.sdoc)"
              printf 'security risks %s\n' \
                "$(grep -c '^\[SECURITY_RESIDUAL_RISK\]' docs/security.sdoc)"
              echo '```'
            else
              echo 'StrictDoc rejected the document; see the job log.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # _cache is StrictDoc's own incremental-build directory and is not part
      # of the output worth keeping.
      - uses: actions/upload-artifact@v4
        with:
          name: requirements-strictdoc
          path: |
            build-docs/html
            build-docs/json
          if-no-files-found: error

  # --- V-model level 5: the unit design, generated from the source -------
  #
  # The document is the gate and the gate is doxygen's warnings: an undocumented
  # parameter or a reference to something that does not exist fails this job.
  # The coverage number is printed because a clean doxygen run proves only that
  # the comments which exist are well formed, and says nothing about the ones
  # that do not (tools/udd-coverage.py has the argument).
  udd:
    name: Unit design document (supervisor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install doxygen
        run: sudo apt-get update -qq && sudo apt-get install -y -qq doxygen graphviz

      - name: Generate, with documentation warnings as errors
        run: tools/udd.sh | tee udd.log

      - name: Summarise what the document covers
        if: always()
        run: |
          {
            echo '### Unit design document'
            echo
            echo 'V-model level 5, generated from the supervisor headers.'
            echo '```'
            sed -n '/Unit design coverage/,/Tasklist/p' udd.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-design-document
          path: |
            firmware/supervisor/build-udd/html/
            firmware/supervisor/build-udd/doxygen-warnings.txt

  # --- architecture 14.6: the target build ------------------------------
  firmware:
    name: Firmware build (esp32s3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Only the simulated-plant configuration builds today: the hardware
      # adapters do not exist, and main.c refuses to build without a plant
      # rather than silently producing an image that drives nothing.  When
      # kiln_hal_esp32s3 lands, build that configuration here too -- it is the
      # one that matters for a release.
      # One container run, so the size report cannot disagree with the image it
      # describes.
      - name: Build and size report
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: esp32s3
          path: firmware/controller
          command: |
            export SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.qemu"
            idf.py build
            idf.py size > build/size.txt
            idf.py size-components > build/size-components.txt
            # SWR-NFR-28, and it has to run HERE rather than in a step after
            # this one: the component licences are scanned from the ESP-IDF tree
            # on disk, and that tree exists only inside this container.
            python3 ../../tools/sbom.py --build-dir build \
                                        --image build/safekiln.bin \
                                        --out-dir build/sbom --format both

      # Summarised from a normal step: $GITHUB_STEP_SUMMARY is a path on the
      # runner, and the step above runs in a container that mounts only the
      # workspace.
      - name: Summarise the image size
        run: |
          {
            echo '### Image size'
            echo
            echo 'SWR-NFR-13: the application must fit a 2 MB OTA slot.'
            echo '```'
            cat firmware/controller/build/size.txt
            echo '```'
            echo
            echo '### Bill of materials'
            echo
            echo 'SWR-NFR-28, CycloneDX and SPDX, generated from the build:'
            echo '```'
            # jq rather than a python heredoc: a heredoc body starts at column
            # zero, which ends the YAML block scalar this step is written in and
            # makes the whole workflow file invalid.  The same trap the release
            # notes step documents, found the same way.
            for f in firmware/controller/build/sbom/*.cdx.json; do
              [ -e "$f" ] || continue
              jq -r '"\(.metadata.component.name) \(.metadata.component.version): \(.components|length) components"' "$f"
              jq -r '.components[] | select(has("licenses") | not) | "  licence unresolved: \(.name)"' "$f"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The HARDWARE configuration, which until now nothing built. Every job
      # above uses sdkconfig.qemu, which sets CONFIG_KILN_PLANT_SIM and
      # compiles out the WiFi, the HTTP server and the whole hardware path in
      # main.cpp. So the configuration that will actually ship was guarded by
      # no build at all, and when it was first tried it did not compile: two
      # -Wformat-truncation errors in code no CI job had ever seen.
      #
      # It is a build and not a test: nothing here can run it. What it buys is
      # that the half of the firmware aimed at real hardware cannot rot
      # unnoticed between now and the first board.
      - name: Build the hardware configuration
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: esp32s3
          path: firmware/controller
          command: |
            idf.py -B build-hw -D SDKCONFIG=build-hw/sdkconfig -D SDKCONFIG_DEFAULTS="sdkconfig.defaults" build
            idf.py -B build-hw size > build-hw/size.txt
            cd ../.. && TARGET_BUILD=firmware/controller/build-hw HOST_BUILD=none tools/layercheck.sh

      - name: Summarise the hardware image size
        if: always()
        run: |
          {
            echo '### Hardware image size'
            echo
            echo 'The configuration with WiFi, the HTTP server and the hardware'
            echo 'adapters, which the simulated build compiles out.'
            echo '```'
            head -20 firmware/controller/build-hw/size.txt || echo 'build failed'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32s3-simulated
          path: |
            firmware/controller/build/safekiln.bin
            firmware/controller/build/safekiln.elf
            firmware/controller/build/safekiln.map
            firmware/controller/build/bootloader/bootloader.bin
            firmware/controller/build/partition_table/partition-table.bin
            firmware/controller/build/flasher_args.json
            firmware/controller/build/sbom/
            firmware/controller/build/size.txt
            firmware/controller/build/size-components.txt
          if-no-files-found: error

  # --- architecture 14.6: boot the image and watch it fire ---------------
  #
  # Not a substitute for the host integration suite, which covers far more and
  # runs in seconds.  What this adds is the one thing the host cannot: that the
  # real image, built by the real toolchain, boots on the target's scheduler and
  # FPU and gets as far as running a program.  Everything about the plant is
  # simulated -- see docs/simulation.md for what that does and does not prove.
  qemu-smoke:
    name: QEMU boot and firing smoke test
    runs-on: ubuntu-latest
    needs: firmware
    steps:
      - uses: actions/checkout@v4

      # The command block below is run by the action as bash -c with the
      # WHOLE block inside single quotes. One apostrophe anywhere in it, in a
      # comment as readily as in a string, ends that quoting and bash exits 2
      # on a parse error before any of it runs. That happened, and the symptom
      # was a job failing with no output at all. So the block is four lines
      # with no quoting hazard in them, and everything else lives in
      # tools/qemu-smoke.sh where it can be read, reviewed and run locally.
      - name: Build and run under QEMU
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: esp32s3
          path: firmware/controller
          command: |
            python "$IDF_PATH/tools/idf_tools.py" install qemu-xtensa
            . "$IDF_PATH/export.sh"
            cd ../..
            tools/qemu-smoke.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qemu-log
          path: firmware/controller/qemu.log
          if-no-files-found: warn
