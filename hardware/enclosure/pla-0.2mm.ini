;
; PrusaSlicer configuration for the Safe Kiln Controller enclosure in PLA, on
; a 0.4 mm nozzle at 0.2 mm layers. Load it in the GUI or let
; tools/slice.sh use it.
;
; ===========================================================================
; WHY THESE VALUES AND NOT THE STOCK PROFILE
; ===========================================================================
; The stock 0.2 mm SPEED profile prints this enclosure perfectly well. The
; departures below are deliberate and each has a reason tied to this part
; rather than to a general preference for quality:
;
;   PERIMETERS = 3. The walls are 2.4 mm, which is exactly three extrusions at
;   0.45 mm. Two would leave a gap filled with infill, and the part that gets
;   handled is the wall a terminal screw is torqued against.
;
;   TOP/BOTTOM = 5/4. The bezel's visible face is a bottom surface and the
;   display window's chamfer is a top surface, both of which show every
;   missing layer.
;
;   NO SUPPORT. The geometry is drawn so that nothing needs it: the shell
;   prints open-face-up and its standoffs grow off the floor, the bezel prints
;   face-down, the knob prints bore-up. If a future change needs support, the
;   change is wrong rather than the profile.
;
;   BRIM 3 mm ON THE SHELL ONLY, set by the script per part. The shell is
;   115 mm tall on a 54 x 81 footprint, which is exactly the aspect ratio that
;   lets a knock mid-print take it off the bed.
;
;   FAN 100 % after the first layers. PLA in a part with small bosses and thin
;   ribs needs the cooling more than it needs the layer adhesion, and this
;   enclosure is not structural.
;
; What this profile is NOT for: anything that gets hot. PLA softens around
; 55 to 60 degC, and an enclosure bolted to a kiln's panel can exceed that.
; See the warning in README.md before printing this in PLA for real use.
;
; ===========================================================================
; WHY THIS FILE IS FLAT AND NOT A BUNDLE
; ===========================================================================
; No [print:...] / [filament:...] / [printer:...] sections. Those make it a
; config BUNDLE, which the GUI imports and which `--load` silently ignores:
; the first version of this file had them, PrusaSlicer accepted it without a
; word, and sliced at 0.3 mm layers, 200 degC and a cold bed. The G-code was
; 891 kB and looked perfectly healthy.
;
; `--load` wants a flat configuration, which is what the GUI's "Export Config"
; writes. slice.sh now reads the settings back out of the finished G-code and
; fails if they are not these, because a profile that is quietly not applied is
; indistinguishable from one that is until the print is on the bed.

layer_height = 0.2
first_layer_height = 0.25
perimeters = 3
top_solid_layers = 5
bottom_solid_layers = 4
fill_density = 20%
fill_pattern = gyroid
top_fill_pattern = monotonic
bottom_fill_pattern = monotonic
solid_infill_every_layers = 0
infill_every_layers = 1
ensure_vertical_shell_thickness = 1
thin_walls = 0
gap_fill_enabled = 1
support_material = 0
support_material_auto = 0
brim_width = 0
brim_type = outer_only
skirts = 1
skirt_distance = 2
skirt_height = 1
seam_position = aligned
external_perimeters_first = 0
perimeter_speed = 45
external_perimeter_speed = 25
infill_speed = 80
solid_infill_speed = 80
top_solid_infill_speed = 40
travel_speed = 180
first_layer_speed = 20
bridge_speed = 25
bridge_flow_ratio = 1
extrusion_width = 0.45
first_layer_extrusion_width = 0.42
external_perimeter_extrusion_width = 0.45
perimeter_extrusion_width = 0.45
infill_extrusion_width = 0.45
solid_infill_extrusion_width = 0.45
top_infill_extrusion_width = 0.4
elefant_foot_compensation = 0.2
; Holes print undersize. 0.1 mm of compensation gets an M3 clearance hole to
; actually pass an M3 and the knob's bore onto the shaft, and is the one
; setting most likely to need adjusting for a particular machine.
hole_size_compensation = 0.1
xy_size_compensation = 0

filament_type = PLA
filament_diameter = 1.75
temperature = 210
first_layer_temperature = 215
bed_temperature = 60
first_layer_bed_temperature = 60
fan_always_on = 1
cooling = 1
min_fan_speed = 100
max_fan_speed = 100
bridge_fan_speed = 100
disable_fan_first_layers = 2
slowdown_below_layer_time = 8
min_print_speed = 15
filament_retract_length = nil
filament_colour = #FF8000
filament_settings_id = "SafeKiln PLA"

printer_technology = FFF
printer_model =
nozzle_diameter = 0.4
; A generic Prusa i3 envelope: MK3S is 250 x 210 x 210 and MK4 250 x 210 x 220,
; so this is the smaller of the two and every part fits either.
bed_shape = 0x0,250x0,250x210,0x210
max_print_height = 210
z_offset = 0
retract_length = 0.8
retract_speed = 35
deretract_speed = 25
retract_before_travel = 1.5
retract_layer_change = 1
wipe = 1
use_relative_e_distances = 1
; Required with relative E, and PrusaSlicer refuses to slice without it:
; relative extrusion accumulates floating-point error unless the position is
; reset each layer. Worth knowing how it refuses -- it printed the reason and
; exited ZERO, writing no file, which is why slice.sh checks that the G-code
; exists and contains a plausible number of moves rather than trusting the
; exit status.
layer_gcode = G92 E0
gcode_flavor = marlin2
; Deliberately minimal: the real start sequence belongs to the machine's own
; profile, and a start G-code copied into a project file is a start G-code
; that goes stale. The script warns when it is slicing with this one.
start_gcode = M115 U3.13.2 ; tell the firmware the slicer version\nG28 ; home\nG29 ; mesh bed level (ignored by firmware that does not have it)\nM104 S[first_layer_temperature] ; set nozzle\nM140 S[first_layer_bed_temperature] ; set bed\nM109 S[first_layer_temperature] ; wait nozzle\nM190 S[first_layer_bed_temperature] ; wait bed\nG92 E0 ; zero the extruder
end_gcode = M104 S0 ; nozzle off\nM140 S0 ; bed off\nG1 X0 Y200 F3000 ; present the part\nM84 ; motors off
between_objects_gcode =
printer_settings_id = "SafeKiln Prusa 0.4"
