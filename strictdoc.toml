# StrictDoc project configuration.  The requirements specification lives in
# docs/03_software_req.sdoc; the other documents under docs/ are prose markdown
# and are deliberately NOT given to StrictDoc, which would otherwise try to
# parse them as requirement documents and fail on the first one without an H1.
[project]
title = "Safe Kiln Controller"
include_doc_paths = [
  "docs/01_user_req.sdoc",
  "docs/02_system_req.sdoc",
  "docs/03_software_req.sdoc",
  "docs/04_software_arch.sdoc",
  "docs/safety.sdoc",
  "docs/security.sdoc",
]
